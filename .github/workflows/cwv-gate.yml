name: Core Web Vitals CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to audit'
        required: false
        default: 'https://example.com'
      min_score:
        description: 'Minimum required CWV Score (0-100)'
        required: false
        default: '90'

jobs:
  cwv-gate-check:
    name: Evaluate Core Web Vitals Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Speed Engine
        run: |
          python -m pip install --upgrade pip
          pip install -e . || true

      - name: Run Core Web Vitals Audit Gate
        id: cwv_audit
        env:
          PYTHONPATH: src
        run: |
          python -c "
          import sys
          from cwv_speed_engine.ui_server import audit_html_content, audit_url
          import json

          url = '${{ github.event.inputs.target_url || 'https://example.com' }}'
          report = audit_url(url, device='mobile')
          score = report.get('score', 0)
          lcp = report['metrics']['lcp']['value']
          cls = report['metrics']['cls']['value']
          inp = report['metrics']['inp']['value']

          print(f'::notice title=CWV Audit Result::Score: {score}/100 | LCP: {lcp}s | CLS: {cls} | INP: {inp}ms')

          min_score = int('${{ github.event.inputs.min_score || '90' }}')
          if score < min_score:
              print(f'::error::CWV Gate Failed: Score {score} is below threshold {min_score}')
              sys.exit(1)
          print('CWV Gate Passed successfully!')
          "
