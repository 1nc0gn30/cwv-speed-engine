name: CI Matrix (15-Job Multi-OS Multi-Python)

on:
  push:
    branches: [ master, main, 'release/**', 'feature/**' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Development & Testing Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install pytest pytest-cov

      - name: Zero-Dependency Core Engine Smoke Test
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import cwv_speed_engine; from cwv_speed_engine import ui_server; print('Core engine imported successfully with standard library only.')"

      - name: Run Pytest Test Suite with Coverage
        run: |
          python -m pytest tests/ -v --cov=src/cwv_speed_engine --cov-report=term-missing
        env:
          PYTHONPATH: src

  lint:
    name: Code Quality & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linters
        run: |
          python -m pip install flake8 black

      - name: Check Formatting with Black
        run: |
          black --check --line-length 120 src/ tests/ || echo "Formatting suggestions logged"

      - name: Lint with Flake8
        run: |
          flake8 src/ tests/ --count --max-line-length=140 --statistics --ignore=E501,W503,E203,E731 || echo "Flake8 check completed"
