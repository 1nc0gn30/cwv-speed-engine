# ==============================================================================
# High-Performance Nginx Configuration for Sub-50ms TTFB & Zero Layout Shifts
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 1. Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Open File Descriptor Cache
    open_file_cache max=10000 inactive=120s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # 2. Gzip & Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/vnd.ms-fontobject
        application/wasm
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        font/woff
        font/woff2
        image/bmp
        image/svg+xml
        image/vnd.microsoft.icon
        text/cache-manifest
        text/calendar
        text/css
        text/javascript
        text/markdown
        text/plain
        text/xml
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;

    # 3. HTTP Server Block
    server {
        listen 80;
        listen [::]:80;
        server_name speed.example.com;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    # 4. HTTPS Server Block (HTTP/2 Enabled)
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name speed.example.com;

        root /var/www/html;
        index index.html;

        # SSL Configuration
        ssl_certificate /etc/letsencrypt/live/speed.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/speed.example.com/privkey.pem;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

        # Security Headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # --------------------------------------------------------------------------
        # A. Immutable Fingerprinted Static Assets (1 Year Max-Age)
        # --------------------------------------------------------------------------
        location ~* \.(?:css|js|woff2|woff|ttf|eot|avif|webp|png|jpg|jpeg|gif|ico|svg)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            tcp_nodelay off;
        }

        # --------------------------------------------------------------------------
        # B. Service Worker & PWA Manifest (Must Revalidate Immediately)
        # --------------------------------------------------------------------------
        location ~* (?:sw\.js|site\.webmanifest|manifest\.json)$ {
            expires -1;
            add_header Cache-Control "public, max-age=0, must-revalidate";
        }

        # --------------------------------------------------------------------------
        # C. HTML Documents & SPA Routing (Edge SWR Revalidation)
        # --------------------------------------------------------------------------
        location / {
            add_header Cache-Control "public, max-age=0, must-revalidate, s-maxage=3600, stale-while-revalidate=86400";
            try_files $uri $uri/ /index.html;
        }
    }
}
